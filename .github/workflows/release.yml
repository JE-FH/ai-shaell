name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            binary: shaell
          - os: macos-latest
            target: macos
            binary: shaell
          - os: windows-latest
            target: windows
            binary: shaell.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --release --verbose

      - name: Rename binary for release
        shell: bash
        run: |
          if [ "${{ matrix.target }}" = "windows" ]; then
            cp target/release/shaell.exe shaell-${{ matrix.target }}.exe
          else
            cp target/release/shaell shaell-${{ matrix.target }}
            strip shaell-${{ matrix.target }}
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          files: |
            shaell-${{ matrix.target }}
            shaell-${{ matrix.target }}.exe
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
